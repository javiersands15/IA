<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IA Assistant</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="logo">AI</div>
          <div>
            <h1>IA Assistant</h1>
            <p>Asistente inteligente</p>
          </div>
        </div>
        <span class="status" id="statusBadge">Demo mode</span>
      </header>

      <main class="chat-panel">
        <div id="messages" class="messages">
          <div class="message bot">
            <div class="bubble">¡Hola! Soy tu asistente IA. ¿En qué puedo ayudarte hoy?</div>
          </div>
        </div>

        <form id="chatForm" class="composer">
          <textarea id="messageInput" rows="1" placeholder="Escribe tu mensaje..." required></textarea>
          <button type="submit">Enviar</button>
        </form>
      </main>
    </div>

    <script src="/script.js"></script>
  </body>
</html>
